<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'" />
<title>Shiba Desktop setup</title>
<style>
  @font-face { font-family: Geist; src: url("fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  body { font: 14px Geist, system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #fafafa; color: #111; }
  main { width: min(420px, 90vw); }
  h1 { font: 400 26px/1.1 "Geist", system-ui, sans-serif; margin: 0 0 8px; }
  p { color: #555; margin: 0 0 16px; }
  label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; min-height: 44px; padding: 8px 10px; font: inherit; border: 1px solid #888; border-radius: 0; }
  button { margin-top: 12px; min-height: 44px; padding: 8px 14px; font: 600 14px Geist, system-ui, sans-serif; border: 1px solid #111; border-radius: 0; background: #111; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
  input:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  #error { color: #b00020; margin-top: 12px; min-height: 1em; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } input { background: #222; color: #eee; border-color: #444; } button { background: #eee; color: #111; } button:focus-visible { outline-color: #fbbf24; } }
</style>
</head>
<body>
<main>
  <h1>Connect to Shiba</h1>
  <p>The app signs in to https://app.tryshiba.dev. Enter a URL only for a self-hosted deployment.</p>
  <form id="form">
    <label for="url">Shiba server address</label>
    <input id="url" type="url" placeholder="https://app.tryshiba.dev" autocomplete="url" required />
    <button type="submit">Continue</button>
  </form>
  <div id="error" role="alert"></div>
</main>
<script src="setup.js"></script>
</body>
</html>
