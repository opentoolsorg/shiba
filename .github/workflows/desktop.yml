name: Desktop
on:
  workflow_dispatch: {}
  pull_request:
    types:
    - labeled

permissions:
  contents: read
jobs:
  desktop-pr:
    if: ${{ ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate') || github.event_name == 'workflow_dispatch') && needs.changes.outputs.desktop == 'true' }}

    # Pin PR/Electron execution to the standard Intel pool. Native ARM
    # execution remains a separate coverage limit; packaging still builds both.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shiba/desktop typecheck
      - run: pnpm --filter @shiba/desktop lint
      - run: pnpm --filter @shiba/desktop test
      # Electron smoke (T65/T66). The script builds dist/, downloads the Electron
      # binary once, then runs one e2e file at a time. macOS runners have a display.
      - run: pnpm --filter @shiba/desktop test:e2e
      - name: Build the real dashboard and local Worker assets
        run: pnpm build
      - name: Install browser for the shared dashboard checks
        run: |
          npm install --prefix .cursor/skills/verify-shiba --no-save --package-lock=false
          npx --prefix .cursor/skills/verify-shiba playwright install chromium
      - name: Verify the configured agent lifecycle in Electron
        env:
          VERIFY_GITHUB: mock
          VERIFY_FEATURE: core-loop-mock
          VERIFY_ENABLE_CONTAINERS: 0
          VERIFY_USE_RUNS_API: 1
          VERIFY_SKIP_INSTALL: 1
          VERIFY_SKIP_BUILD: 1
          VERIFY_AGENT_THREADS: 1
          VERIFY_AGENT_LIFECYCLE: 1
          VERIFY_DESKTOP: 1
        run: bash .cursor/skills/verify-shiba/scripts/run-ci.sh
      - name: Verify Marketing deliverables in Electron with a fresh local Worker
        env:
          CI: true
          VERIFY_DESKTOP: 1
        run: node .cursor/skills/verify-shiba/scripts/run-employee-ci.mjs
      # Unsigned build: signing secrets are never present on PRs.
      # dist/ is gitignored — compile main.js before packaging (REVIEW3 F4).
      - run: pnpm --filter @shiba/desktop build
      - run: pnpm --filter @shiba/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shiba-desktop-unsigned
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            .verify/desktop-agent-lifecycle/**
            .verify/desktop-shell/**
            .verify/local-daemon-e2e/ui-employee-desktop/**
            .verify/employee-ci-*/worker.log
            .verify/employee-ci-*/migrate.log
            .verify/employee-ci-*/result.json
            .verify/evidence/**
            !.verify/**/auth.json
            !.verify/**/run.env*
            !.verify/**/worker.env
            !.verify/**/state/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-desktop-pr
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}
    needs: changes
  sandbox-image:
    if: ${{ ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate') || github.event_name == 'workflow_dispatch') && needs.changes.outputs.sandbox_image == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned sandbox image without credentials or publishing
        run: |
          docker build --pull --progress=plain --platform linux/amd64 \
            --tag "shiba-sandbox-validation:${GITHUB_SHA}" \
            --file apps/backend/Dockerfile apps/backend
      - name: Verify installed tools without network access or coding execution
        run: |
          timeout 180s docker run --rm -i --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 1g --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --env HOME=/tmp/shiba-smoke --env XDG_CACHE_HOME=/tmp/shiba-smoke/cache \
            --env XDG_CONFIG_HOME=/tmp/shiba-smoke/config \
            --entrypoint /bin/sh "shiba-sandbox-validation:${GITHUB_SHA}" -eu <<'SMOKE'
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME"
          for tool in git curl python3 node duckdb agent-reach opencode claude codex grok pi gemini claude-agent-acp codex-acp cursor-agent agy shiba-acp-install xdotool scrot procoder sandbox-shim; do
            command -v "$tool"
          done
          node --version
          python3 --version
          duckdb -version
          agent-reach help >/dev/null
          opencode --version
          claude --version
          codex --version
          grok --version
          pi --version
          gemini --version
          cursor-agent --version
          procoder version
          test -x /opt/agy/agy_acp_server.par
          test -x /opt/agy/localharness_external
          SMOKE
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-sandbox-image
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}
  computer-image:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' && needs.changes.outputs.computer_image == 'true' }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned offline desktop without credentials or publishing
        run: |
          imageDockerConfig=$(mktemp -d /tmp/shiba-computer-docker.XXXXXX)
          trap 'rm -rf "$imageDockerConfig"' EXIT
          timeout 900s docker --config "$imageDockerConfig" build --pull --progress=plain --platform linux/amd64 \
            --secret id=proxy_ca,src=/etc/ssl/certs/ca-certificates.crt \
            --tag shiba-computer-offline:ci --file apps/backend/Dockerfile.computer apps/backend
      - name: Verify real offline display, human input, capture and watchdog
        run: node apps/backend/computer/verify-offline.mjs --image shiba-computer-offline:ci --output /tmp/shiba-computer-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shiba-offline-computer-evidence
          path: |
            /tmp/shiba-computer-evidence/report.json
            /tmp/shiba-computer-evidence/*.jpg
          if-no-files-found: warn
          retention-days: 3
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-computer-image
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}
  desktop-release:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/desktop-v') }}

    needs: desktop-pr
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shiba/desktop typecheck
      - run: pnpm --filter @shiba/desktop test
      # Signing + notarization secrets are added by a human in repo settings.
      - run: pnpm --filter @shiba/desktop build
      # Tag builds are the electron-updater channel. Publish the GitHub release.
      - run: pnpm --filter @shiba/desktop exec electron-builder --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
  changes:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.files.outputs.desktop }}
      sandbox_image: ${{ steps.files.outputs.sandbox_image }}
      computer_image: ${{ steps.files.outputs.computer_image }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Test validation change selection
      run: python3 -B -m unittest discover -s .github/scripts -p 'test_select_validation_changes.py'
    - name: Select desktop and sandbox image changes
      id: files
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 -B .github/scripts/select_validation_changes.py
