name: Desktop
on:
  workflow_dispatch: {}
  pull_request:
    types:
    - labeled

permissions:
  contents: read
jobs:
  desktop-pr:
    if: ${{ ((github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate') || github.event_name == 'workflow_dispatch') && needs.changes.outputs.desktop == 'true' }}

    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shiba/desktop typecheck
      - run: pnpm --filter @shiba/desktop lint
      - run: pnpm --filter @shiba/desktop test
      # Electron smoke (T65/T66). The script builds dist/, downloads the Electron
      # binary once, then runs one e2e file at a time. macOS runners have a display.
      - run: pnpm --filter @shiba/desktop test:e2e
      - name: Build the real dashboard and local Worker assets
        run: pnpm build
      - name: Install browser for the shared dashboard checks
        run: |
          npm install --prefix .cursor/skills/verify-shiba --no-save --package-lock=false
          npx --prefix .cursor/skills/verify-shiba playwright install chromium
      - name: Verify the configured agent lifecycle in Electron
        env:
          VERIFY_GITHUB: mock
          VERIFY_FEATURE: core-loop-mock
          VERIFY_ENABLE_CONTAINERS: 0
          VERIFY_USE_RUNS_API: 1
          VERIFY_SKIP_INSTALL: 1
          VERIFY_SKIP_BUILD: 1
          VERIFY_AGENT_THREADS: 1
          VERIFY_AGENT_LIFECYCLE: 1
          VERIFY_DESKTOP: 1
        run: bash .cursor/skills/verify-shiba/scripts/run-ci.sh
      - name: Verify Marketing deliverables in Electron with a fresh local Worker
        env:
          CI: true
          VERIFY_DESKTOP: 1
        run: node .cursor/skills/verify-shiba/scripts/run-employee-ci.mjs
      # Unsigned build: signing secrets are never present on PRs.
      # dist/ is gitignored — compile main.js before packaging (REVIEW3 F4).
      - run: pnpm --filter @shiba/desktop build
      - run: pnpm --filter @shiba/desktop exec electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: shiba-desktop-unsigned
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            .verify/desktop-agent-lifecycle/**
            .verify/desktop-shell/**
            .verify/local-daemon-e2e/ui-employee-desktop/**
            .verify/employee-ci-*/worker.log
            .verify/employee-ci-*/migrate.log
            .verify/employee-ci-*/result.json
            .verify/evidence/**
          if-no-files-found: warn
          retention-days: 3
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-desktop-pr
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}
    needs: changes
  desktop-release:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/desktop-v') }}

    needs: desktop-pr
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shiba/desktop typecheck
      - run: pnpm --filter @shiba/desktop test
      # Signing + notarization secrets are added by a human in repo settings.
      - run: pnpm --filter @shiba/desktop build
      # Tag builds are the electron-updater channel. Publish the GitHub release.
      - run: pnpm --filter @shiba/desktop exec electron-builder --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: false
  changes:
    if: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.files.outputs.desktop }}
    steps:
    - name: Select desktop changes
      id: files
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: "python3 - <<'PYTHON'\nimport json, os, urllib.request\nfrom pathlib import PurePosixPath\n\ndef relevant(path):\n    if path.startswith(('apps/', 'packages/', 'scripts/', 'patches/', '.cursor/skills/verify-shiba/', '.github/')):\n        return True\n    if path.startswith(('docs/', 'screenshots/')):\n        return False\n    # Unknown files and root configuration select the full desktop checks.\n    return True\n\ndef select():\n    for page in range(1, 31):\n        url = f\"https://api.github.com/repos/{os.environ['GH_REPO']}/pulls/{int(os.environ['PR_NUMBER'])}/files?per_page=100&page={page}\"\n        request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})\n        with urllib.request.urlopen(request, timeout=30) as response:\n            files = json.load(response)\n        for item in files:\n            if relevant(item['filename']) or (item.get('previous_filename') and relevant(item['previous_filename'])):\n                return True\n        if len(files) < 100:\n            return False\n    return True  # GitHub limits the PR files endpoint to 3,000 files.\n\ntry:\n    desktop = select()\nexcept Exception:\n    desktop = True\nwith open(os.environ['GITHUB_OUTPUT'], 'a') as output:\n    output.write(f\"desktop={str(desktop).lower()}\\n\")\nPYTHON"
