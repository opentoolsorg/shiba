name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - apps/backend/Dockerfile
      - apps/backend/scripts/acp-install.sh
      - .github/workflows/build-sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build and push sandbox image to Cloudflare registry
        id: image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          tag="shiba-ai-coworker-sandbox-dogfood:sha-${GITHUB_SHA}"
          npx --yes wrangler@4.140.0 containers build --push \
            --tag "$tag" \
            apps/backend
          ref="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${tag}"
          image=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$ref" \
            | grep -E "^registry[.]cloudflare[.]com/${CLOUDFLARE_ACCOUNT_ID}/shiba-ai-coworker-sandbox-dogfood@sha256:[a-f0-9]{64}$")
          test -n "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$image"
          {
            echo '### Dogfood sandbox image'
            echo "Source commit: ${GITHUB_SHA}"
            echo "\`$image\`"
            echo 'Pin this digest in apps/backend/wrangler.dogfood.jsonc before deploying the Worker.'
          } >> "$GITHUB_STEP_SUMMARY"
