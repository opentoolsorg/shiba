name: Preview deploy (alchemy, pr-<n> stage)

# Labeled same-repo PRs get an isolated
# ALCHEMY_STAGE=pr-<n> deploy (worker/stores suffixed by alchemy.run.ts) and a
# comment with its workers.dev URL. Fork PRs skip (no secrets + no trust);
# the close job destroys the stage when the PR merges or closes.

on:
  pull_request:
    types:
    - labeled
    - closed

permissions:
  contents: read
jobs:
  deploy-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' && github.event.pull_request.state == 'open' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check PR is still open
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state,headRefOid --jq '.state + " " + .headRefOid')
          echo "open=$([ "$state" = "OPEN $EXPECTED_HEAD" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Deploy preview stack via alchemy
        if: steps.pr-state.outputs.open == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: ${{ env.STAGE }}
          ACCESS_EMAILS: ${{ secrets.ACCESS_EMAILS }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APPROVERS: ${{ secrets.SLACK_APPROVERS }}
          DASHBOARD_APPROVERS: ${{ secrets.DASHBOARD_APPROVERS }}
          SLACK_CHANNEL_REPOS: ${{ secrets.SLACK_CHANNEL_REPOS }}
          SLACK_APPROVALS_CHANNEL: ${{ secrets.SLACK_APPROVALS_CHANNEL }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          CLAUDE_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_SUBSCRIPTION_TOKEN }}
          CODEX_SUBSCRIPTION_AUTH_JSON: ${{ secrets.CODEX_SUBSCRIPTION_AUTH_JSON }}
          LOCAL_ADAPTER_TOKEN: ${{ secrets.LOCAL_ADAPTER_TOKEN }}
          INTERNAL_SIGNING_KEY: ${{ secrets.INTERNAL_SIGNING_KEY }}
        # alchemy reads stage from ALCHEMY_STAGE at module level — never
        # pass --stage. Preview stages skip the custom domain entirely and
        # serve on <worker>.<subdomain>.workers.dev instead.
        run: pnpm run deploy:alchemy
      - name: Comment preview URL on the PR
        if: success() && steps.pr-state.outputs.open == 'true' && env.WORKERS_SUBDOMAIN != ''
        env:
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_HOST: shiba-ai-coworker-pr-${{ github.event.pull_request.number }}.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "Preview deploy (stage \`${STAGE}\`): https://${PREVIEW_HOST}/app/"

    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: shiba-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 30
  destroy-preview:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Destroy preview stack
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: ${{ env.STAGE }}
          ACCESS_EMAILS: ${{ secrets.ACCESS_EMAILS }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
        run: pnpm exec alchemy destroy
    concurrency:
      group: shiba-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    timeout-minutes: 30
