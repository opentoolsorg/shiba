name: Preview deploy (isolated PR stage)

on:
  pull_request:
    types: [labeled, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: shiba-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Same-repository code only; a maintainer label remains the deploy opt-in.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       (github.event.pull_request.state == 'open' &&
        contains(github.event.pull_request.labels.*.name, 'preview:deploy')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/preview-guard.test.mjs scripts/deploy.test.mjs
      - name: Guard and deploy or destroy the exact PR stage
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
          ALCHEMY_STATE_BACKEND: cloudflare
          PREVIEW_OPERATION: ${{ github.event.action == 'closed' && '--destroy' || '' }}
          PREVIEW_ACCOUNT_ID: ${{ vars.SHIBA_PREVIEW_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_BETTER_AUTH_SECRET }}
          BETTER_AUTH_OWNER_EMAIL: ${{ secrets.PREVIEW_BETTER_AUTH_OWNER_EMAIL }}
          INTERNAL_SIGNING_KEY: ${{ secrets.PREVIEW_INTERNAL_SIGNING_KEY }}
          ARTIFACT_SIGNING_KEY: ${{ secrets.PREVIEW_ARTIFACT_SIGNING_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy.mjs --stage="$ALCHEMY_STAGE" $PREVIEW_OPERATION
