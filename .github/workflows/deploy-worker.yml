name: Deploy worker (alchemy)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage (prod preserves the existing live state)
        type: choice
        options: [prod, dogfood]
        required: true
        default: prod
      sandbox_image:
        description: Prebuilt registry.cloudflare.com image ref (empty = Docker build)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.stage == 'prod' && 'live' || inputs.stage || 'live' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy stack via alchemy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_STAGE: ${{ inputs.stage || 'live' }}
          SANDBOX_IMAGE: ${{ inputs.sandbox_image }}
          # Operator-managed vars come from repo secrets too — absent names
          # are skipped by secrets()/configVars() in alchemy.run.ts. The
          # GitHub-prefixed secrets cannot map directly from repo secrets.
          # Alchemy replaces bindings; use the Mac path if this stage needs them.
          # CLOUDFLARE_API_TOKEN needs read+write on every resource alchemy
          # plans (Workers, D1, KV, R2, Vectorize, containers, secrets) or
          # the plan phase 401s — a deploy-only-scoped token can't diff.
          ACCESS_EMAILS: ${{ secrets.ACCESS_EMAILS }}
          WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_APPROVERS: ${{ secrets.SLACK_APPROVERS }}
          DASHBOARD_APPROVERS: ${{ secrets.DASHBOARD_APPROVERS }}
          SLACK_CHANNEL_REPOS: ${{ secrets.SLACK_CHANNEL_REPOS }}
          SLACK_APPROVALS_CHANNEL: ${{ secrets.SLACK_APPROVALS_CHANNEL }}
          SLACK_CANVAS_OWNERS: ${{ vars.SLACK_CANVAS_OWNERS || '[]' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          CLAUDE_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_SUBSCRIPTION_TOKEN }}
          CODEX_SUBSCRIPTION_AUTH_JSON: ${{ secrets.CODEX_SUBSCRIPTION_AUTH_JSON }}
          LOCAL_ADAPTER_TOKEN: ${{ secrets.LOCAL_ADAPTER_TOKEN }}
          INTERNAL_SIGNING_KEY: ${{ secrets.INTERNAL_SIGNING_KEY }}
          ARTIFACT_SIGNING_KEY: ${{ secrets.ARTIFACT_SIGNING_KEY }}
          WORKER_HOSTNAME: ${{ inputs.stage == 'dogfood' && format('shiba-ai-coworker-dogfood.{0}.workers.dev', secrets.WORKERS_SUBDOMAIN) || 'app.tryshiba.dev' }}
          OPEN_CONNECTOR_WORKER: ${{ vars.OPEN_CONNECTOR_WORKER || '' }}
          BETTER_AUTH_URL: ${{ inputs.stage == 'dogfood' && format('https://shiba-ai-coworker-dogfood.{0}.workers.dev', secrets.WORKERS_SUBDOMAIN) || 'https://app.tryshiba.dev' }}
        run: node scripts/deploy.mjs --stage="$ALCHEMY_STAGE"
