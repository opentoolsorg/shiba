name: CI
# Every push to a pull request and to main runs the lint and check lanes, so a
# result always describes the current head. verify-shiba is the slow browser
# journey: it runs on main and on pull requests labelled build:validate.
# all-checks-pass is the one check branch protection should require.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  biome-knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check offline agent context budgets
        run: pnpm check:agent-context
      # biome ci: lint-only for now — formatting is adopted incrementally
      # (config enables it for `pnpm format`), not retro-applied repo-wide.
      - run: pnpm exec biome ci --formatter-enabled=false --assist-enabled=false .
      - run: pnpm check:knip
    timeout-minutes: 30
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check:deploy diffs the sandbox image inputs against the pull request base.
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm routes:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:imports
      - run: node --test scripts/schema-snapshot.test.mjs scripts/ci-workflow.test.mjs
      - run: pnpm test
      - name: Verify personal native account isolation and daemon controls
        run: pnpm test:personal-daemon
      - run: pnpm build
      # Boot guard for the bundled Worker: dependency dedupe has twice broken
      # startup without any unit test noticing (zod initialized after the
      # sandbox SDK's top-level schemas -> "Class is not a constructor").
      - name: Verify the Worker boots and serves the dashboard locally
        run: pnpm selfhost:smoke
      - name: Verify invited teammate review of a private research brief
        run: node --test apps/backend/test/acceptance/research-room-fixture.test.mjs
      - run: pnpm docs:check
      # Marketing page and SEO assertions run against the generated site.
      # SEO tests skip in the earlier unit step when dist does not exist.
      - run: pnpm test:built
      - run: pnpm check:deploy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm check:source-layout
      - run: cp .env.example .env
      - run: node scripts/check-dev-vars-example.mjs
      - name: Validate example environment with a synthetic account
        # Schema checks use no Cloudflare credentials or deployment command.
        env:
          CLOUDFLARE_ACCOUNT_ID: '00000000000000000000000000000000'
        run: pnpm env:load && pnpm env:scan

    timeout-minutes: 30
  verify-shiba:
    if: "${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'build:validate') }}"
    # The pinned Playwright 1.55.1 browser/dependency map supports Ubuntu 24.04.
    # Keep runner image upgrades separate from browser-version upgrades.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verify/playwright-browsers
          key: playwright-chromium-${{ runner.os }}-1.55.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright Chromium (verify-shiba)
        run: |
          npm install --prefix .cursor/skills/verify-shiba --no-save
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.verify/playwright-browsers" \
            npx --prefix .cursor/skills/verify-shiba playwright install-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.verify/playwright-browsers" \
            npx --prefix .cursor/skills/verify-shiba playwright install chromium
      - name: verify-shiba (mock GitHub)
        env:
          VERIFY_GITHUB: mock
          CI: true
          VERIFY_SKIP_INSTALL: 1
          VERIFY_SKIP_BUILD: 1
          VERIFY_PORT: 8788
          GITHUB_STUB_PORT: 8799
          VERIFY_ENABLE_CONTAINERS: 0
          VERIFY_USE_RUNS_API: 1
          VERIFY_FEATURE: core-loop-mock
          VERIFY_AGENT_THREADS: 1
          VERIFY_AGENT_LIFECYCLE: 1
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verify/playwright-browsers
        run: bash .cursor/skills/verify-shiba/scripts/run-ci.sh
      - name: Verify Marketing deliverables with a fresh local Worker and daemon
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verify/playwright-browsers
        run: node .cursor/skills/verify-shiba/scripts/run-employee-ci.mjs
      - name: Upload verify-shiba artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-shiba-${{ github.run_id }}
          path: |
            .verify/evidence/**
            .verify/drive/**
            .verify/agent-threads/**
            .verify/agent-lifecycle/**
            .verify/local-daemon-e2e/ui-employee-web/**
            .verify/employee-ci-*/worker.log
            .verify/employee-ci-*/migrate.log
            .verify/employee-ci-*/result.json
            .verify/wrangler.log
            .verify/migrate.log
            !.verify/**/auth.json
            !.verify/**/run.env*
            !.verify/**/worker.env
            !.verify/**/state/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
  all-checks-pass:
    # The single required check. It fails when any lane failed or was cancelled,
    # and when verify-shiba was skipped although this run should have included it.
    if: ${{ !cancelled() }}
    needs: [biome-knip, check, verify-shiba]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          VERIFY_RESULT: ${{ needs.verify-shiba.result }}
          VERIFY_EXPECTED: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'build:validate') }}
        run: |
          echo "lane results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required lane failed or was cancelled."; exit 1
          fi
          if [ "$VERIFY_EXPECTED" = "true" ] && [ "$VERIFY_RESULT" != "success" ]; then
            echo "verify-shiba was expected on this run but reported $VERIFY_RESULT."; exit 1
          fi
          if [ "$(echo "$RESULTS" | grep -o '"skipped"' | wc -l)" -gt "$([ "$VERIFY_RESULT" = skipped ] && echo 1 || echo 0)" ]; then
            echo "A lane other than verify-shiba was skipped."; exit 1
          fi
concurrency:
  # One run per pull request: a new push or label cancels the older run. Runs on
  # main are never cancelled, so every merged commit gets a result.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
