name: CI
on:
  pull_request:
    types:
    - labeled

permissions:
  contents: read
jobs:
  biome-knip:
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # biome ci: lint-only for now — formatting is adopted incrementally
      # (config enables it for `pnpm format`), not retro-applied repo-wide.
      - run: pnpm exec biome ci --formatter-enabled=false --assist-enabled=false .
      # Baseline: 6 known findings listed in the PR (utils.ts, 4 unused
      # backend exports). max-issues gates regressions while they're triaged.
      - run: pnpm exec knip --reporter compact --max-issues 6
  check:
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:imports
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:check
      # Built-output assertions (marketing-pages.test.ts) run post-build —
      # they skip inside `pnpm test`, which runs before dist exists.
      - run: pnpm test:built
      - run: pnpm check:deploy
      - run: cp .env.example .env
      - run: node scripts/check-dev-vars-example.mjs
      - run: pnpm env:load && pnpm env:scan

  verify-shiba:
    if: "${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'build:validate' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verify/playwright-browsers
          key: playwright-chromium-${{ runner.os }}-1.55.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright Chromium (verify-shiba)
        run: |
          npm install --prefix .cursor/skills/verify-shiba --no-save
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.verify/playwright-browsers" \
            npx --prefix .cursor/skills/verify-shiba playwright install-deps chromium
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.verify/playwright-browsers" \
            npx --prefix .cursor/skills/verify-shiba playwright install chromium
      - name: verify-shiba (mock GitHub)
        env:
          VERIFY_GITHUB: mock
          CI: true
          VERIFY_SKIP_INSTALL: 1
          VERIFY_SKIP_BUILD: 1
          VERIFY_PORT: 8788
          GITHUB_STUB_PORT: 8799
          VERIFY_ENABLE_CONTAINERS: 0
          VERIFY_USE_RUNS_API: 1
          VERIFY_FEATURE: core-loop-mock
          VERIFY_AGENT_THREADS: 1
          VERIFY_AGENT_LIFECYCLE: 1
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verify/playwright-browsers
        run: bash .cursor/skills/verify-shiba/scripts/run-ci.sh
      - name: Verify Marketing deliverables with a fresh local Worker and daemon
        env:
          CI: true
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.verify/playwright-browsers
        run: node .cursor/skills/verify-shiba/scripts/run-employee-ci.mjs
      - name: Upload verify-shiba artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-shiba-${{ github.run_id }}
          path: |
            .verify/evidence/**
            .verify/drive/**
            .verify/agent-threads/**
            .verify/agent-lifecycle/**
            .verify/local-daemon-e2e/ui-employee-web/**
            .verify/employee-ci-*/worker.log
            .verify/employee-ci-*/migrate.log
            .verify/employee-ci-*/result.json
            .verify/wrangler.log
            .verify/migrate.log
          if-no-files-found: warn
          retention-days: 14
